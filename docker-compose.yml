version: '3.4'
services:
  app:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GPT_MODEL=${GPT_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - WEAVIATE_URL=${WEAVIATE_URL}
      #- WEAVIATE_URL=${WEAVIATE_CLOUD_URL}
      - PDF_LOCATION=${PDF_LOCATION}
      - PDF_STRUCTURED_LOCATION=${PDF_STRUCTURED_LOCATION}
      - UNSTRUCTURED_PORT=${UNSTRUCTURED_PORT}
      - UNSTRUCTURED_CONTAINER_PORT=${UNSTRUCTURED_CONTAINER_PORT}
    depends_on:
      - weaviate
      - unstructured
    volumes:
      - ./${PDF_STRUCTURED_LOCATION}:/usr/src/app/${PDF_STRUCTURED_LOCATION} # Need to map the structured files to persist the data
      - ./test:/usr/src/app/test # Allow for updated test to be added dynamically
      - ./casinoai:/usr/src/app/casinoai # Allow for updated main module files to be added dynamically
  unstructured:
    image: quay.io/unstructured-io/unstructured-api:latest
    ports:
      - "${UNSTRUCTURED_PORT}:${UNSTRUCTURED_CONTAINER_PORT}"
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    image: semitechnologies/weaviate
    ports:
      - 8080:8080
    restart: on-failure
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      OPENAI_APIKEY: ${OPENAI_API_KEY}
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      #DEFAULT_VECTORIZER_MODULE: 'text2vec-contextionary'
      ENABLE_MODULES: 'text2vec-openai,generative-openai,text2vec-contextionary,sum-transformers'
      CLUSTER_HOSTNAME: 'node1'
      PROMETHEUS_MONITORING_ENABLED: 'true'
      CONTEXTIONARY_URL: contextionary:9999
      SUM_INFERENCE_API: "http://sum-transformers:8080"
  contextionary:
    environment:
      OCCURRENCE_WEIGHT_LINEAR_FACTOR: 0.75
      EXTENSIONS_STORAGE_MODE: weaviate
      EXTENSIONS_STORAGE_ORIGIN: http://weaviate:8080
      NEIGHBOR_OCCURRENCE_IGNORE_PERCENTILE: 5
      ENABLE_COMPOUND_SPLITTING: 'false'
    image: semitechnologies/contextionary:en0.16.0-v1.2.1
    ports:
      - 9999:9999
  sum-transformers:
    image: semitechnologies/sum-transformers:facebook-bart-large-cnn-latest
    # image: semitechnologies/sum-transformers:google-pegasus-xsum-1.2.0  # Could be used instead
    environment:
      ENABLE_CUDA: '0'
    #ports:
    #  - 8088:8080
  prometheus:
    image: prom/prometheus:v2.36.2
    volumes:
      - ./prometheus:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana-oss
    ports:
      - 3000:3000
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ./grafana/dashboard_provider.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
volumes:
  weaviate_data:
  prometheus_data:
