approval:
  approved_by: claude (review delegated by chris, 2026-07-22)
  approved_at: '2026-07-23T02:58:55.420403+00:00'
  annotations:
  - 'Draft v1 ambiguities resolved as follows:'
  - '''Level 9 or 10'' retreat (p.101): the $5 series defines 9 levels; wins at level
    9 go to level 3. The ''10'' applies only to larger-base variants not modeled here.'
  - "Level-8 stake conflict (Appendix D says 60, main text says 65): using 65 (13\
    \ units) \u2014 every table and sample game in the main text uses 65."
  - 'Double-zero hedge: excluded; the book states no procedure for it. Modeled on
    the single-zero wheel the system is designed for.'
  - '90% Rule / ''close enough'' game end: modeled as the exact 8-unit target win.
    The vague early-quit guideline is not deterministic and slightly favors the player
    less than ''close enough'' would; noted as a conservative simplification.'
  - 'Column-bet applicability (p.95): statistically identical to dozens; modeled dozens
    per the author''s own recommendation.'
  - 'Total Bankroll = 2x Game Bankroll (p.118,122), buy-in >= Game Bankroll (p.124),
    mandatory break after a losing game (p.124): cross-session money management, outside
    the per-session simulator; recorded here for the live-play phase.'
  - 'Zeros: count as a lost bet and advance the progression; excluded from the dozen-selection
    history (book pp. as extracted).'
