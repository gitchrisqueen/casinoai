name: Super Fibonacci
version: 2
game: baccarat
also_applicable_to:
- roulette
- craps
- blackjack
summary: 'Even-money system: 7-step modified-''Fibonacci'' ladder (units 1, 1.6, 2.6,
  4, 7, 10, 12 for a $5 base) with a mandatory parlay after every win; a winning parlay
  completes the series. After three consecutive losing wagers, switch to a 5-step
  Martingale fallback (1, 2, 4, 8, 16 units) until a win, then resume the ladder one
  level above the last ladder loss. Bets chosen by Power Pivot: repeat the previous
  decision (Same mode) or its opposite, switching modes after each loss, with a one-round
  extension after three consecutive losses. The session ends when the next required
  wager cannot be covered.'
table_rules:
  variant: 8-deck punto banco
  min_bet: null
  max_bet: null
  notes:
  - Banker commission 5% applies; the book treats banker as even-money anyway.
bets:
- bet_type: player
  description: null
- bet_type: banker
  description: null
bet_selection:
  kind: registered
  name: power_pivot
  description: Same/Opposite mode switching on losses; 3-loss one-round extension;
    no bet until one decision observed; ties are no-decisions
entry_conditions: []
progression:
  kind: registered
  name: super_fibonacci
  description: 7-step ladder + mandatory parlay + 5-step Martingale fallback after
    3 consecutive losses
bankroll:
  unit_size: 5.0
  session_bankroll_units: 40.0
  stop_loss_units: 40.0
  stop_win_units: null
  max_bet_units: 24.0
  max_rounds: null
state_tracked:
- Previous decision outcome (for Power Pivot Same/Opposite mode)
- 'Current bet selection mode: Same, Opposite, or Extended'
- Consecutive loss count
- "Current position in the Fibonacci betting series (level 1\u20137) or Martingale\
  \ fallback series (level 1\u20135)"
- Whether the next wager is a parlay
- Last losing Fibonacci level before entering Martingale fallback
- Session cumulative profit/loss
assumptions:
- The $5 base-bet version is used as the primary example; the system scales to other
  bases ($1, $2, $10, $25, etc.) with proportional bankrolls and series values.
- Total bankroll should be at least three times the Game Bankroll (session buy-in).
- "Win goal is stated as $80\u2013$100 for the $5 base (16\u201320 units), but the\
  \ cardinal stop-win rule is to quit immediately after any winning parlay."
- For online play where a wager is required to activate the game, the player may assume
  an arbitrary starting mode and bet (e.g., bet Player in Same Mode) without observing
  a prior decision.
- Ties in baccarat and zeros in roulette are ignored for determining the Power Pivot
  mode, but they count as losses for bet-sizing progression (except under en prison/la
  partage rules, where a push/surrender may keep the bet size unchanged).
- Blackjack requires a larger Game Bankroll than the standard table because of splits
  and doubles, and uses a modified basic strategy provided in the source.
- The source also mentions Sic Bo as applicable, but it is not included in the schema
  enum.
