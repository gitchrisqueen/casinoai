  annotations:
  - 'Draft v1 ambiguities resolved as follows (machine: casinoai/rules/library.py):'
  - "'Fibonacci' series 5-8-13-20-35-50-60 is not the true Fibonacci sequence: modeled\
    \ exactly as printed \u2014 we test the book's system, not its math vocabulary."
  - 'Parlay loss at ladder top (level 7): no higher level exists; the 3-consecutive-loss
    Martingale trigger governs, and the level is capped at 7 until then.'
  - 'Martingale exhaustion (5 straight losses): source silent; modeled as a busted
    series (session over). Sum lost by then exceeds the 40-unit game bankroll anyway.'
  - 'Sample-game contradiction (resume at $50 vs ''one level higher'' rule): the written
    rule wins; resume one level above the last ladder loss.'
  - 'Player Card ''28'' at level 4 vs text''s ''20'': using 20 (13 occurrences in
    text and all sample games).'
  - 'Power Pivot: no bet until one decision observed; ties are non-decisions (bet
    pushes, no mode switch); the 3-loss extension follows the written text, treating
    the p.64 table as consistent with it per the verifier.'
  - "Primary game baccarat (mini-baccarat is the book's main text); roulette/craps/blackjack\
    \ variants noted in also_applicable_to but not modeled \u2014 blackjack uses bet-sizing\
    \ only per p.115 and needs the future blackjack engine."
  - "Banker commission: engine settles banker wins at 0.95:1 as real tables do, even\
    \ though the book calls it even-money \u2014 honest measurement includes the commission."
