name: Formula 57 Blackjack
version: 2
game: blackjack
also_applicable_to: []
summary: "Bet sizing over basic-strategy blackjack in three modes. Foundation: six-level\
  \ Fibonacci ladder (1, 1.6, 2.6, 4.2, 6.8, 11 units) \u2014 up one on a loss, down\
  \ one on a win, series complete (reset to Level 1) on two straight wins or two of\
  \ the last three. Rapid Recovery: 1,2,4,8,16 Martingale after three consecutive\
  \ losing bets (pushes ignored); any win resumes Foundation one level above the last\
  \ Foundation bet; losing all five loses the game. Profit Participation after a Level-1\
  \ Foundation win: 1.4, then 1.2, then 1.6 + 0.4 per win; any loss resumes Foundation\
  \ at Level 2. Game targets +10 units on a 40-unit bankroll."
