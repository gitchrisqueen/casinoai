approval:
  approved_by: claude (review delegated by chris, 2026-07-23)
  approved_at: '2026-07-23T04:13:45.845725+00:00'
  annotations:
  - 'Draft v1 ambiguities resolved (machine in casinoai/rules/library.py, verified
    against the book''s Example 3 worked table pp.119-120):'
  - "Optional 7th Foundation level ($89): excluded \u2014 the book itself never uses\
    \ it in any example or game ('the original system was set up with seven bets,\
    \ the 7 part of Formula 57')."
  - 'Consecutive-loss count crosses modes (Example 3 rounds 3-5: PP loss + two Foundation
    losses trigger Rapid Recovery).'
  - 'RR resume level: one above the last Foundation bet, per Example 3 round 10 (F4
    after losing F3).'
  - 'Profit Participation stakes fixed from the book''s $5 schedule: 7, 6, 8, 10,
    12... ($7/$5 = the ''5-7'' of Formula 57); the vague ''40-60%'' phrasing resolved
    to the printed numbers.'
  - Foundation completion window counts Foundation bets only and clears on mode changes.
  - 'Restricted Strategy at Foundation L5-6 / RR L5 is NOT modeled: the engine always
    plays full basic strategy, which has a LOWER house edge than the restricted variant,
    so measured results are if anything charitable to the system.'
  - Doubles and splits stake additional money beyond the progression stake, exactly
    as at a real table; net results include them.
  - "Blackjack engine rules: 6-deck, S17, DAS, split to two hands, BJ 3:2, no surrender\
    \ \u2014 the common rule set the book assumes."
