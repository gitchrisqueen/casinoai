state_tracked:
- current betting mode (Foundation, Rapid Recovery, or Profit Participation)
- current level within the active betting series
- consecutive Foundation losses (ignoring pushes)
- Profit Participation step index
- session net win/loss relative to Target Win
- remaining Game Bankroll
- whether Basic or Restricted playing strategy is active
assumptions:
- Pushes (ties) are ignored when counting consecutive losses to trigger Rapid Recovery
  mode.
- "The player uses the Formula 57 Basic Strategy for lower bet levels and the Restricted\
  \ Strategy for higher bet levels (Foundation Levels 5\u20136 and Rapid Recovery\
  \ Levels 5\u20136)."
- A 'game' is a short session averaging about 21 rounds, ending when the Target Win
  is reached or the Game Bankroll is exhausted.
- The Total Bankroll is recommended to be 4 times the Game Bankroll to absorb up to
  four consecutive losing games.
- Bet sizes scale proportionally with the chosen Base Bet; $5 is used as the canonical
  example throughout the source.
