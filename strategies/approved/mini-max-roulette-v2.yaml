state_tracked:
- previous spin result (ignoring zeros for IAB purpose)
- current bet-selection pattern (S or S2)
- count of consecutive losing even-money bets
- contents (chip counts) of Spots A, B, C in current Betting Group
- number of Betting Groups used in current game (Group 1 or Group 2)
- zero-hedge series progress (number of consecutive zero bets placed and current stake
  in zero series)
assumptions:
- Base Bet (1 unit) is chosen by player (examples in book use $10 base). The spec
  leaves currency/unit numeric base unspecified (unit_size=null) because book gives
  multiple example unit sizes.
- A 'game' (session) is the sequence of spins from initial setup of Group 1 until
  either (a) a Pivot Bet is won (a single wager >= 4 * Base Bet) or (b) the Loss Limit
  is reached.
- When starting without knowledge of the previous spin (e.g., starting online with
  no history), start with pattern S and bet Red as instructed by the book.
- Zeros (0 or 00) are ignored when determining bet placement under IAB; a spin that
  lands on zero counts as a loss for wagers but does not change the S/S2 pattern selection
  logic.
