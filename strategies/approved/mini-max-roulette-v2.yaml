approval:
  approved_by: claude (review delegated by chris, 2026-07-22)
  approved_at: '2026-07-23T03:57:57.112919+00:00'
  annotations:
  - 'Draft v1 ambiguities resolved (machines in casinoai/rules/library.py, unit-tested
    against the book''s worked examples pp.66-67 and 70-73):'
  - '6- vs 9-unit buy-in: 6 units per game per the rules summary (''never risk more
    than two Betting Groups''); the 9-unit figure belongs to the optional zero-hedge
    (BPS) variant, which has no complete procedure and is not modeled.'
  - "4-unit Loss Limit vs 6-unit exposure: both enforced as written \u2014 stop at\
    \ net -4u or after two lost groups, whichever first."
  - 'Winnings placement: leftmost empty spot replenished first, else the B->C->A cycle;
    the cycle pointer does not advance on replenishments (matches the worked example).'
  - 'En prison / la partage: not modeled; the book notes them as edge-reducers but
    ties no rules to them.'
  - 'PPCP (pull back and continue) optional move: not modeled; the book itself recommends
    calling the game complete at the pivot.'
  - 'Online ''default to Red before any decision'' shortcut: not modeled; sessions
    observe one decision before betting, per the land-based rule.'
