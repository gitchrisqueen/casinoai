name: Mini-Max Roulette
version: 2
game: roulette
also_applicable_to: []
summary: 'One even-money red/black wager per spin. Bet placement by IAB: bet the previous
  decision (S mode); after two consecutive losing bets switch to betting the second-preceding
  decision (S2), and back again after two more. Bet sizing by the Mini-Max chip stacks:
  three spots A/B/C of one Base Bet each; always wager the entire leftmost non-empty
  stack; a win returns the stake and places the winnings on the leftmost empty spot,
  else cycling B, C, A. Winning any single wager of 4+ units (the Pivot Bet) completes
  the game. A game allows two Betting Groups (6 units max exposure) with a special
  Loss Limit of 4 units.'
