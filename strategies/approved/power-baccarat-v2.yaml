  annotations:
  - 'Draft v1 ambiguities resolved (machines in casinoai/rules/library.py, verified
    against the book''s 14-round worked table pp.62-65 and Target Betting rules pp.48-50):'
  - 'Strike losses at Level 8: no Level 9 exists; stay at L8 (the next loss is the
    second consecutive and enters Counterstrike regardless).'
  - Counterstrike resume level ('one above the last Strike bet') capped at Level 8.
  - The two-of-three win-reset window counts Strike-mode results only and clears on
    mode changes.
  - A Level-1 Strike win always enters Trend mode (takes precedence over the win-reset
    rule).
  - 'Tracker repeat: after the one-bet repeat, the alternation restarts at S and the
    loss count resets (''win or lose your next bet will be on S'').'
  - 'Ties: Player/Banker bets push; ties are not decisions and advance nothing (book:
    ignore ties entirely).'
  - "Trend Level-1 stake is 1.2u ($6) \u2014 the book's printed series really does\
    \ start 6,5,8: verified against both the table and the worked example."
  - Game bankroll/loss limit 87u and target +8u per the book's money-management chapter
    figures in the draft.
