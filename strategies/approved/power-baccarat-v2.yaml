name: Power Baccarat
version: 2
game: baccarat
also_applicable_to: []
summary: "Player/Banker only (never Tie). Bet placement by Tracker/Target selection:\
  \ alternate betting the Same as and the Opposite of the last decision every round;\
  \ after two consecutive losing bets repeat the last pattern letter for one bet,\
  \ then restart the alternation. Bet sizing by three modes: Strike ladder (1,2,3,5,8,13,21,34\
  \ units; up on loss, down on win, reset to L1 on two straight wins or two of three),\
  \ Counterstrike Martingale (0.6,1,2,4,8,16,32) after two consecutive Strike losses\
  \ \u2014 a win resumes Strike one level above the last Strike bet, losing all seven\
  \ loses the game \u2014 and Trend (1.2,1,1.6,2,2.4,2.8,3.2, then +0.6 per win) after\
  \ a Level-1 Strike win, exiting on any loss to the lowest Strike level above the\
  \ lost stake. Game targets +8 units."
