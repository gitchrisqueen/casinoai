state_tracked:
- Last non-tie outcome (Player or Banker)
- Current Tracker pattern (Same or Opposite)
- Current betting mode (Strike, Counterstrike, or Trend)
- Current level within the active mode's betting series
- Consecutive loss count in the current mode (ignoring ties)
- Last Strike bet level before entering Counterstrike (for return-level calculation)
- Last Trend bet amount/level (for return-level calculation after a Trend loss)
- Recent win/loss history over the last three Strike bets to evaluate the 'two wins
  in a row or two out of three' reset condition
assumptions:
- The player must mentally track the last non-tie outcome to apply the S/O pattern;
  ties are invisible to the pattern engine.
- The 'two out of three wins' reset in Strike mode implies evaluating the most recent
  three Strike bets; if two were wins, the next Strike bet drops to Level 1.
- When returning from Counterstrike to Strike, the 'next higher level' refers to the
  Strike level immediately above the last losing Strike bet that preceded Counterstrike
  entry.
- When returning from Trend to Strike after a loss, the Strike level chosen is the
  one whose dollar value exceeds the lost Trend bet.
- A winning Banker bet counts as a win for progression and pattern purposes even though
  it nets less than even money after the 5% commission.
- The system is designed exclusively for even-money baccarat wagers (Player or Banker);
  Tie is never wagered.
